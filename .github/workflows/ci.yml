name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  format:
    name: Format
    runs-on: namespace-profile-nvmbr-sm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  lint:
    name: Clippy
    runs-on: namespace-profile-nvmbr-md
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: namespace-profile-nvmbr-md
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  # Builds the real program and makes it draw: every preset, in every
  # style. Catches the kind of break that unit tests can't see.
  smoke:
    name: Draw every bouquet (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: namespace-profile-nvmbr-md
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Draw
        run: |
          set -eu
          posy=target/release/posy
          [ "${{ matrix.os }}" != windows ] || posy=target/release/posy.exe
          export XDG_CONFIG_HOME="$RUNNER_TEMP/config"
          "$posy" --version
          "$posy" list
          mkdir -p shots
          for bouquet in classic roses wildflower sunset spring blush midnight; do
            for style in ascii blocks fine; do
              out="shots/$bouquet-$style.html"
              "$posy" -b "$bouquet" --style "$style" --color truecolor snapshot "$out" --size 120x44
              # A frame with a bouquet in it is never tiny.
              test "$(wc -c < "$out")" -gt 5000
            done
          done
          "$posy" -b examples/ask.toml --style fine --color truecolor snapshot shots/ask.html --size 150x52
          "$posy" bench --size 170x58
      - uses: actions/upload-artifact@v4
        with:
          name: bouquets-${{ matrix.os }}
          path: shots
          retention-days: 7

  script:
    name: Install script
    runs-on: namespace-profile-nvmbr-sm
    steps:
      - uses: actions/checkout@v5
      - name: Check install.sh
        run: |
          sh -n install.sh
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck install.sh

  windows-script:
    name: Install script (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check install.ps1 parses in both PowerShells
        run: |
          $check = '$errors = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$null, [ref]$errors) | Out-Null; if ($errors) { $errors | Format-List; exit 1 }'
          pwsh -NoProfile -Command $check
          if ($LASTEXITCODE) { exit 1 }
          powershell -NoProfile -Command $check
          if ($LASTEXITCODE) { exit 1 }
