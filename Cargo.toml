[package]
name = "posy"
version = "0.1.0"
edition = "2024"
description = "a little 3D bouquet for your terminal"
license = "MIT"
repository = "https://github.com/kyledickey/posy"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.8", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[profile.release]
lto = true
strip = true

# The bouquet is drawn in software, so even test builds need to be fast.
[profile.dev]
opt-level = 3
